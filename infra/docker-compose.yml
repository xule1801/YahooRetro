# Môi trường LOCAL/THỬ NGHIỆM. Secret lấy từ infra/.env (không commit). Xem docs/operations.md.
name: yahoochat
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yahoochat
      POSTGRES_USER: yc_owner
      POSTGRES_PASSWORD: ${YC_PG_OWNER_PASSWORD:?set in infra/.env}
      YC_APP_DB_PASSWORD: ${YC_APP_DB_PASSWORD:?}
      YC_PROSODY_DB_PASSWORD: ${YC_PROSODY_DB_PASSWORD:?}
    ports: ["127.0.0.1:${YC_PG_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yc_owner -d yahoochat"]
      interval: 2s
      retries: 30
  prosody:
    image: ${YC_PROSODY_IMAGE:-prosodyim/prosody:13.0}
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      YC_DOMAIN: ${YC_DOMAIN:-localhost}
      YC_PROSODY_DB_PASSWORD: ${YC_PROSODY_DB_PASSWORD:?}
      YC_XMPP_TOKEN_SECRET: ${YC_XMPP_TOKEN_SECRET:?}
      YC_MESSAGE_TTL_DAYS: ${YC_MESSAGE_TTL_DAYS:-30}
    ports: ["127.0.0.1:5222:5222", "127.0.0.1:5223:5223"]
    volumes:
      - ./prosody/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - ./prosody/plugins:/etc/prosody/yc_plugins:ro
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
