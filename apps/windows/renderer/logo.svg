<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Zahu!Messenger">
  <title>Zahu!Messenger</title>
  <!-- Logo gốc của dự án Zahu!Messenger: bong bóng chat tím bóng + mặt cười vàng nháy mắt bên trong + ngôi sao lấp lánh.
       Không dùng chữ cái trong bong bóng, không có thanh "!" riêng, không đặt mặt cười đè góc — khác bố cục logo Yahoo. -->
  <defs>
    <radialGradient id="zbub" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#c58bf2"/>
      <stop offset=".45" stop-color="#8a35d0"/>
      <stop offset="1" stop-color="#4a128a"/>
    </radialGradient>
    <radialGradient id="zface" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#fff59a"/>
      <stop offset=".5" stop-color="#ffd21f"/>
      <stop offset="1" stop-color="#ee9a00"/>
    </radialGradient>
    <linearGradient id="zgloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="zmouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1500"/>
      <stop offset="1" stop-color="#c0291a"/>
    </linearGradient>
  </defs>
  <!-- đuôi bong bóng (chếch trái) -->
  <path d="M30 88 L10 122 L54 100 Z" fill="#5a1aa0" stroke="#2e0858" stroke-width="3" stroke-linejoin="round"/>
  <!-- thân bong bóng -->
  <ellipse cx="64" cy="58" rx="56" ry="48" fill="url(#zbub)" stroke="#2e0858" stroke-width="3"/>
  <path d="M36 92 L22 112 L50 98" fill="#6a22b5"/>
  <ellipse cx="54" cy="30" rx="38" ry="16" fill="url(#zgloss)"/>
  <!-- mặt cười bên trong -->
  <circle cx="64" cy="62" r="31" fill="url(#zface)" stroke="#b56d00" stroke-width="2.5"/>
  <ellipse cx="54" cy="47" rx="14" ry="6" fill="#fff" opacity=".55"/>
  <ellipse cx="53" cy="56" rx="4.2" ry="6" fill="#2a1a00"/>
  <circle cx="54.6" cy="53.6" r="1.5" fill="#fff"/>
  <path d="M69 57 q6 -7 12 0" fill="none" stroke="#2a1a00" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M45 68 h38 q-2 18 -19 18 q-17 0 -19 -18 z" fill="url(#zmouth)" stroke="#5a1000" stroke-width="2" stroke-linejoin="round"/>
  <path d="M47.5 69.5 h33 v4.2 h-33 z" fill="#fff"/>
  <path d="M55 80 q9 -6 18 0 q-9 6 -18 0 z" fill="#ff7d93"/>
  <!-- ngôi sao lấp lánh -->
  <path d="M108 12 l3.4 9.6 l9.6 3.4 l-9.6 3.4 l-3.4 9.6 l-3.4 -9.6 l-9.6 -3.4 l9.6 -3.4 z" fill="#ffd21f" stroke="#c98a00" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="120" cy="44" r="3" fill="#ffe36b"/>
</svg>
